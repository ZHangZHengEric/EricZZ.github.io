<svg width="1024" height="1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Digital Tokens (Virtual Side) -->
  <circle cx="256" cy="256" r="60" fill="#00d4ff" opacity="0.8"/>
  <circle cx="350" cy="300" r="40" fill="#00d4ff" opacity="0.6"/>
  <circle cx="200" cy="350" r="50" fill="#00d4ff" opacity="0.7"/>
  <text x="256" y="260" font-family="Arial" font-size="14" fill="white" text-anchor="middle">TOKEN</text>

  <!-- Physical World (Right Side) -->
  <rect x="600" y="200" width="150" height="150" fill="#ff6b6b" opacity="0.7" rx="10"/>
  <rect x="700" y="350" width="120" height="120" fill="#ff6b6b" opacity="0.6" rx="10"/>
  <text x="675" y="290" font-family="Arial" font-size="14" fill="white" text-anchor="middle">PHYSICAL</text>

  <!-- Transformation Arrow -->
  <line x1="400" y1="300" x2="600" y2="300" stroke="#ffd93d" stroke-width="8" marker-end="url(#arrowhead)"/>

  <!-- Title -->
  <text x="512" y="500" font-family="Arial" font-size="48" fill="#ffd93d" text-anchor="middle" font-weight="bold">Token 狂欢</text>
  <text x="512" y="560" font-family="Arial" font-size="48" fill="#ffd93d" text-anchor="middle" font-weight="bold">与物理觉醒</text>

  <!-- Subtitle -->
  <text x="512" y="650" font-family="Arial" font-size="24" fill="#ffffff" text-anchor="middle">2026 年 AI 技术十字路口的深度观察</text>

  <!-- Author -->
  <text x="512" y="750" font-family="Arial" font-size="20" fill="#00d4ff" text-anchor="middle">Eric Zhang</text>

  <!-- Decorative Elements -->
  <circle cx="100" cy="900" r="30" fill="#00d4ff" opacity="0.3"/>
  <circle cx="900" cy="900" r="40" fill="#ff6b6b" opacity="0.3"/>
  <circle cx="512" cy="900" r="25" fill="#ffd93d" opacity="0.4"/>
</svg>
