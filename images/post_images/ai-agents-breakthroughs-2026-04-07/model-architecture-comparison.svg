<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1024" viewBox="0 0 1280 1024">
  <rect width="1280" height="1024" fill="#0f3460"/>
  <!-- Traditional architecture (left) -->
  <rect x="100" y="200" width="400" height="600" fill="#1a1a2e" opacity="0.8"/>
  <rect x="150" y="250" width="300" height="80" fill="#533483" opacity="0.7"/>
  <rect x="150" y="350" width="300" height="80" fill="#533483" opacity="0.7"/>
  <rect x="150" y="450" width="300" height="80" fill="#533483" opacity="0.7"/>
  <rect x="150" y="550" width="300" height="80" fill="#533483" opacity="0.7"/>
  <rect x="150" y="650" width="300" height="80" fill="#533483" opacity="0.7"/>
  <text x="300" y="150" font-family="Arial" font-size="36" fill="#ffffff" text-anchor="middle" opacity="0.8">Traditional Transformer</text>
  <!-- New architecture (right) -->
  <rect x="780" y="200" width="400" height="600" fill="#16213e" opacity="0.8"/>
  <circle cx="980" cy="300" r="60" fill="#e94560" opacity="0.7"/>
  <circle cx="880" cy="450" r="50" fill="#00d4ff" opacity="0.7"/>
  <circle cx="1080" cy="450" r="50" fill="#00d4ff" opacity="0.7"/>
  <circle cx="980" cy="600" r="55" fill="#533483" opacity="0.7"/>
  <line x1="980" y1="360" x2="920" y2="440" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <line x1="980" y1="360" x2="1040" y2="440" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <line x1="920" y1="500" x2="980" y2="590" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <line x1="1040" y1="500" x2="980" y2="590" stroke="#ffffff" stroke-width="2" opacity="0.5"/>
  <text x="980" y="150" font-family="Arial" font-size="36" fill="#ffffff" text-anchor="middle" opacity="0.8">New Architecture (Potato)</text>
</svg>
