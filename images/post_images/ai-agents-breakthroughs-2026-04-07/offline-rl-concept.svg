<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#1a1a2e"/>
  <!-- Local paths (red, fragmented) -->
  <circle cx="200" cy="300" r="40" fill="#e94560" opacity="0.8"/>
  <circle cx="250" cy="350" r="35" fill="#e94560" opacity="0.7"/>
  <circle cx="180" cy="400" r="30" fill="#e94560" opacity="0.6"/>
  <line x1="200" y1="300" x2="250" y2="350" stroke="#e94560" stroke-width="2" opacity="0.5"/>
  <!-- Global paths (blue, unified) -->
  <circle cx="700" cy="300" r="50" fill="#0f3460" opacity="0.9"/>
  <circle cx="780" cy="400" r="45" fill="#533483" opacity="0.8"/>
  <circle cx="700" cy="500" r="40" fill="#0f3460" opacity="0.9"/>
  <line x1="700" y1="300" x2="780" y2="400" stroke="#533483" stroke-width="3" opacity="0.6"/>
  <line x1="780" y1="400" x2="700" y2="500" stroke="#533483" stroke-width="3" opacity="0.6"/>
  <line x1="700" y1="300" x2="700" y2="500" stroke="#533483" stroke-width="3" opacity="0.6"/>
  <!-- Transition arrow -->
  <line x1="400" y1="512" x2="550" y2="512" stroke="#ffffff" stroke-width="4" opacity="0.8"/>
  <polygon points="550,512 520,500 520,524" fill="#ffffff" opacity="0.8"/>
  <text x="512" y="800" font-family="Arial" font-size="36" fill="#ffffff" text-anchor="middle" opacity="0.8">Local → Global Optimization</text>
</svg>
