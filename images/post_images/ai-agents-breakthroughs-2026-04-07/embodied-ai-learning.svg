<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#16213e"/>
  <!-- Learning curve -->
  <polyline points="100,900 200,850 300,750 400,600 500,450 600,320 700,230 800,180 900,150" fill="none" stroke="#00d4ff" stroke-width="6" opacity="0.9"/>
  <!-- Data points -->
  <circle cx="100" cy="900" r="15" fill="#00d4ff"/>
  <circle cx="300" cy="750" r="15" fill="#00d4ff"/>
  <circle cx="500" cy="450" r="15" fill="#00d4ff"/>
  <circle cx="700" cy="230" r="15" fill="#00d4ff"/>
  <circle cx="900" cy="150" r="15" fill="#00d4ff"/>
  <!-- Success rate indicator -->
  <rect x="600" y="50" width="300" height="80" rx="10" fill="#533483" opacity="0.7"/>
  <text x="750" y="100" font-family="Arial" font-size="40" fill="#ffffff" text-anchor="middle" opacity="0.9">99% Success Rate</text>
  <!-- Robot icon -->
  <circle cx="150" cy="150" r="40" fill="#00d4ff" opacity="0.6"/>
  <rect x="110" y="200" width="80" height="100" fill="#00d4ff" opacity="0.6"/>
  <text x="512" y="900" font-family="Arial" font-size="32" fill="#ffffff" text-anchor="middle" opacity="0.8">Embodied AI Learning Curve</text>
</svg>
