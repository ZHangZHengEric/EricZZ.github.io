---
layout: default
---

<main class="personal-page" id="main-content">
  <div class="personal-page__inner">
    <header class="personal-page__header">
      <h1>
        {% if page.title_en %}
          <span data-language-content="zh">{{ page.title }}</span>
          <span data-language-content="en" lang="en">{{ page.title_en }}</span>
        {% else %}
          {{ page.title }}
        {% endif %}
      </h1>
      {% if page.description_en %}
        <p>
          <span data-language-content="zh">{{ page.description }}</span>
          <span data-language-content="en" lang="en">{{ page.description_en }}</span>
        </p>
      {% elsif page.description %}<p>{{ page.description }}</p>{% endif %}
    </header>
    <section class="personal-page__content">
      {{ content }}
    </section>
  </div>
</main>
